[package]
name = "bhwi"
version = "0.0.1"
edition = "2021"
authors = ["Edouard Paris <m@edouard.paris>"]
repository = "https://github.com/wizardsardine/bhwi"
license-file = "../LICENSE"
keywords = ["bitcoin",  "miniscript"]
description = "development kit"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["jade"]
jade = ["serde", "serde_bytes", "serde_cbor"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json.workspace = true
serde_bytes = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
bitcoin.workspace = true

# coldcard encryption
aes.workspace = true
ctr.workspace = true
k256.workspace = true
base64ct.workspace = true

# TODO: remove me
log.workspace = true
